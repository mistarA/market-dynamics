    <script>
      (() => {
        try {
          const stored = localStorage.getItem('mss-theme');
          const theme =
            stored === 'light' || stored === 'dark' ? stored : 'light';
          document.documentElement.dataset.theme = theme;
        } catch {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
